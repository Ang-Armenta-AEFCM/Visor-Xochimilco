<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visor Xochimilco | Proyecciones e Infraestructura</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="proyecciones.css"></head><body>
<header><div><h1>Visor educativo de Xochimilco</h1><p>Proyecciones de matrícula e infraestructura escolar</p></div><button id="menuBtn">☰</button></header>
<div class="layout"><aside id="panel"><div class="tabs"><button class="tab active" data-view="proyeccion">Proyecciones</button><button class="tab" data-view="infraestructura">Infraestructura</button></div>
<p id="projectionCoverage" style="font-size:12px;line-height:1.5;margin:10px 0"></p><label>Buscar inmueble o CCT<input id="search" placeholder="Escribe nombre, CCT o ID"></label><label>Nivel<select id="nivel"><option value="">Todos</option></select></label>

<button id="clear">Limpiar filtros</button><div id="stats" class="stats"></div><div class="legend" id="legend"></div><button id="download">Descargar CSV filtrado</button></aside><main><div id="map"></div><div id="detail" class="detail hidden"><button id="closeDetail">×</button><div id="detailContent"></div><canvas id="chart" height="150"></canvas></div></main></div>
